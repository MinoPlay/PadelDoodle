<svg id="header-svg" class="w-full h-auto min-w-[700px] rounded-lg shadow-2xl transition-all duration-300" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradients -->
                        <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#020617"/>
                            <stop offset="45%" stop-color="#0B1F3A"/>
                            <stop offset="100%" stop-color="#0C4A6E"/>
                        </linearGradient>
                        <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#2563EB"/>
                            <stop offset="100%" stop-color="#06B6D4"/>
                        </linearGradient>
                        <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#60A5FA"/>
                            <stop offset="100%" stop-color="#0369A1"/>
                        </linearGradient>
                        <filter id="animeGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur"/>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Background Base -->
                    <rect width="1200" height="420" rx="16" fill="url(#headerBg)"/>
                    
                    <!-- Anime Speed Lines & Grid Rays -->
                    <g opacity="0.18">
                        <path d="M600,210 L0,0 M600,210 L0,80 M600,210 L0,160 M600,210 L0,240 M600,210 L0,320 M600,210 L0,420 M600,210 L200,420 M600,210 L400,420 M600,210 L600,420 M600,210 L800,420 M600,210 L1000,420 M600,210 L1200,420 M600,210 L1200,320 M600,210 L1200,240 M600,210 L1200,160 M600,210 L1200,80 M600,210 L1200,0 M600,210 L1000,0 M600,210 L800,0 M600,210 L600,0 M600,210 L400,0 M600,210 L200,0" stroke="#FFF" stroke-width="3"/>
                    </g>
                    
                    <!-- Neon Circle & Energy Burst -->
                    <circle cx="600" cy="210" r="175" fill="none" stroke="url(#neonPinkGrad)" stroke-width="8" opacity="0.8" filter="url(#animeGlow)"/>
                    <circle cx="600" cy="210" r="145" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="12 8" opacity="0.7"/>

                    <!-- Action Slash Line -->
                    <path d="M-50,320 L1250,120" stroke="#7DD3FC" stroke-width="8" opacity="0.8"/>
                    <path d="M-50,340 L1250,140" stroke="#2563EB" stroke-width="4" opacity="0.6"/>

                    <!-- Left Group: Flaming Padel Racket & Ball -->
                    <g transform="translate(180, 200) rotate(-18)">
                        <!-- Flaming Trail -->
                        <path d="M-80,-10 C-140,-50 -200,0 -260,-20 C-200,40 -120,20 -80,-10 Z" fill="url(#neonPinkGrad)" opacity="0.85"/>
                        <!-- Racket Handle -->
                        <rect x="-15" y="60" width="30" height="90" rx="8" fill="#111" stroke="#000" stroke-width="4"/>
                        <rect x="-10" y="65" width="20" height="80" rx="4" fill="#00F0FF"/>
                        <!-- Racket Frame -->
                        <ellipse cx="0" cy="0" rx="75" ry="90" fill="#1A1C23" stroke="#000" stroke-width="6"/>
                        <ellipse cx="0" cy="0" rx="65" ry="80" fill="#252A38" stroke="#2563EB" stroke-width="4"/>
                        <!-- Padel Holes -->
                        <g fill="#000">
                            <circle cx="-35" cy="-40" r="5"/><circle cx="-15" cy="-40" r="5"/><circle cx="15" cy="-40" r="5"/><circle cx="35" cy="-40" r="5"/>
                            <circle cx="-45" cy="-20" r="5"/><circle cx="-25" cy="-20" r="5"/><circle cx="0" cy="-20" r="5"/><circle cx="25" cy="-20" r="5"/><circle cx="45" cy="-20" r="5"/>
                            <circle cx="-45" cy="0" r="5"/><circle cx="-25" cy="0" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="25" cy="0" r="5"/><circle cx="45" cy="0" r="5"/>
                            <circle cx="-35" cy="20" r="5"/><circle cx="-15" cy="20" r="5"/><circle cx="0" cy="20" r="5"/><circle cx="15" cy="20" r="5"/><circle cx="35" cy="20" r="5"/>
                            <circle cx="-25" cy="40" r="5"/><circle cx="0" cy="40" r="5"/><circle cx="25" cy="40" r="5"/>
                        </g>
                    </g>

                    <!-- Flying Ball with Impact Trail -->
                    <g transform="translate(390, 120)">
                        <line x1="-110" y1="-15" x2="-35" y2="-10" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
                        <line x1="-130" y1="12" x2="-45" y2="12" stroke="#7DD3FC" stroke-width="7" stroke-linecap="round"/>
                        <line x1="-100" y1="35" x2="-35" y2="28" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="0" cy="0" r="32" fill="url(#ballGrad)" stroke="#000" stroke-width="4"/>
                        <path d="M-22,-15 C-5,-5 -5,15 -22,22" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
                        <path d="M22,-15 C5,-5 5,15 22,22" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
                    </g>

                    <!-- Center Main Header Typography: Official Not Official Demant Padel Club -->
                    <g transform="translate(600, 205)">
                        <!-- Background Shield Ribbon Plate -->
                        <polygon points="-360,-80 360,-80 330,80 -330,80" fill="#0D0E15" stroke="#000" stroke-width="6"/>
                        <polygon points="-350,-70 350,-70 323,70 -323,70" fill="#2563EB" stroke="#00F0FF" stroke-width="3"/>
                        
                        <!-- Top Subtitle Ribbon -->
                        <rect x="-240" y="-110" width="480" height="34" rx="17" fill="#7DD3FC" stroke="#000" stroke-width="4"/>
                        <text x="0" y="-88" text-anchor="middle" fill="#000" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="900" letter-spacing="3">OFFICIAL NOT OFFICIAL</text>

                        <!-- Main Title Text Lines -->
                        <text x="0" y="-10" text-anchor="middle" fill="#7DD3FC" font-family="Bangers, cursive" font-size="62" font-weight="900" letter-spacing="4" stroke="#000" stroke-width="6" paint-order="stroke fill">DEMANT PADEL CLUB</text>
                        <text x="0" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Bangers, cursive" font-size="46" font-weight="900" letter-spacing="5" stroke="#000" stroke-width="5" paint-order="stroke fill">PADEL • BURGERS • DRINKS</text>

                        <!-- Side Floating Badges -->
                        <g transform="translate(-320, -45) rotate(-12)">
                            <rect x="-45" y="-18" width="90" height="36" rx="18" fill="#00F0FF" stroke="#000" stroke-width="3"/>
                            <text x="0" y="6" text-anchor="middle" fill="#000" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="900">ONODPC</text>
                        </g>
                        <g transform="translate(320, 45) rotate(10)">
                            <rect x="-45" y="-18" width="90" height="36" rx="18" fill="#7DD3FC" stroke="#000" stroke-width="3"/>
                            <text x="0" y="6" text-anchor="middle" fill="#000" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="900">SMASH!</text>
                        </g>
                    </g>

                    <!-- Right Group: Anime Chibi Food & Drinks -->
                    <g transform="translate(950, 230)">
                        <ellipse cx="0" cy="65" rx="65" ry="14" fill="rgba(0,0,0,0.4)"/>
                        <!-- Bun -->
                        <path d="M-48,35 C-48,55 48,55 48,35 Z" fill="#E68A2E" stroke="#000" stroke-width="4"/>
                        <rect x="-54" y="18" width="108" height="18" rx="8" fill="#5C2C16" stroke="#000" stroke-width="4"/>
                        <path d="M-52,18 L52,18 L45,32 L28,22 L8,38 L-12,22 L-32,34 L-45,22 Z" fill="#FFCC00" stroke="#000" stroke-width="3"/>
                        <path d="M-50,8 C-50,-45 50,-45 50,8 Z" fill="#F4A261" stroke="#000" stroke-width="4"/>
                        <!-- Sparkles -->
                        <path d="M-58,-25 L-53,-35 L-48,-25 L-38,-20 L-48,-15 L-53,-5 L-58,-15 L-68,-20 Z" fill="#FFF" opacity="0.9"/>
                    </g>

                    <!-- Cheers Beer Mug -->
                    <g transform="translate(1080, 170) rotate(12)">
                        <rect x="-28" y="-40" width="56" height="85" rx="8" fill="#FFC107" stroke="#000" stroke-width="4"/>
                        <path d="M-33,-40 C-33,-58 -15,-52 0,-58 C15,-52 33,-58 33,-40 Z" fill="#FFFFFF" stroke="#000" stroke-width="4"/>
                        <path d="M28,-20 C48,-20 48,20 28,20" fill="none" stroke="#000" stroke-width="6"/>
                        <path d="M28,-20 C48,-20 48,20 28,20" fill="none" stroke="#FFC107" stroke-width="3"/>
                        <!-- Sparks -->
                        <path d="M-40,-45 L-55,-60 M-35,-25 L-55,-30" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>
                    </g>
                </svg>